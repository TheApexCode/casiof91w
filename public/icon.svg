<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181a20" />
      <stop offset="100%" stop-color="#0b0d10" />
    </linearGradient>
    <linearGradient id="caseGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2c3038" />
      <stop offset="50%" stop-color="#1c1f24" />
      <stop offset="100%" stop-color="#121418" />
    </linearGradient>
    <linearGradient id="btnGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9aa0a6" />
      <stop offset="50%" stop-color="#e8eaed" />
      <stop offset="100%" stop-color="#5f6368" />
    </linearGradient>
  </defs>

  <!-- Dark Background Container -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)" />

  <!-- Top and Bottom Straps -->
  <rect x="180" y="20" width="152" height="80" fill="#14161a" rx="8" />
  <line x1="180" y1="45" x2="332" y2="45" stroke="#0a0b0d" stroke-width="4" />
  <line x1="180" y1="65" x2="332" y2="65" stroke="#0a0b0d" stroke-width="4" />

  <rect x="180" y="412" width="152" height="80" fill="#14161a" rx="8" />
  <line x1="180" y1="435" x2="332" y2="435" stroke="#0a0b0d" stroke-width="4" />
  <line x1="180" y1="455" x2="332" y2="455" stroke="#0a0b0d" stroke-width="4" />

  <!-- Side Buttons (Pushers) -->
  <!-- Button A (Top Left) -->
  <rect x="66" y="165" width="20" height="42" rx="4" fill="url(#btnGrad)" stroke="#000" stroke-width="2" />
  <!-- Button B (Bottom Left) -->
  <rect x="66" y="305" width="20" height="42" rx="4" fill="url(#btnGrad)" stroke="#000" stroke-width="2" />
  <!-- Button C (Bottom Right) -->
  <rect x="426" y="305" width="20" height="42" rx="4" fill="url(#btnGrad)" stroke="#000" stroke-width="2" />

  <!-- Main Octagonal Resin Case -->
  <polygon points="126,80 386,80 436,130 436,382 386,432 126,432 76,382 76,130"
           fill="url(#caseGrad)" stroke="#08090b" stroke-width="6" />

  <!-- Corner Screws -->
  <circle cx="120" cy="112" r="5" fill="#3c4043" stroke="#000" stroke-width="1.5" />
  <circle cx="392" cy="112" r="5" fill="#3c4043" stroke="#000" stroke-width="1.5" />
  <circle cx="120" cy="400" r="5" fill="#3c4043" stroke="#000" stroke-width="1.5" />
  <circle cx="392" cy="400" r="5" fill="#3c4043" stroke="#000" stroke-width="1.5" />

  <!-- Faceplate Inner Bezel -->
  <rect x="108" y="112" width="296" height="288" rx="20" fill="#0d0e12" stroke="#000" stroke-width="4" />

  <!-- Blue Pinstripe -->
  <rect x="120" y="124" width="272" height="264" rx="14" fill="none" stroke="#1d64c2" stroke-width="3" />

  <!-- Inner Gold Frame -->
  <rect x="130" y="134" width="252" height="244" rx="10" fill="none" stroke="#d4a330" stroke-width="2" />

  <!-- CASIO Brand Header -->
  <text x="144" y="162" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="20" letter-spacing="3">CASIO</text>
  <text x="238" y="161" fill="#e8eaed" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="14">F-91W</text>
  <text x="368" y="160" fill="#d4a330" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="9" text-anchor="end">ALARM CHRONO</text>

  <!-- Red WATER RESIST badge -->
  <rect x="306" y="174" width="64" height="14" rx="3" fill="#b91c1c" stroke="#ffffff" stroke-width="1" />
  <text x="338" y="184" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="7.5" text-anchor="middle">WATER RESIST</text>

  <!-- Button Indicators -->
  <text x="144" y="184" fill="#ffffff" font-family="Arial, sans-serif" font-weight="bold" font-size="8">◄ LIGHT</text>
  <text x="144" y="362" fill="#ffffff" font-family="Arial, sans-serif" font-weight="bold" font-size="8">◄ MODE</text>
  <text x="368" y="362" fill="#ffffff" font-family="Arial, sans-serif" font-weight="bold" font-size="8" text-anchor="end">24HR / START ►</text>

  <!-- LCD Screen Unit (Reflective Olive Gray) -->
  <rect x="144" y="196" width="224" height="150" rx="8" fill="#a4b79a" stroke="#000" stroke-width="3" />

  <!-- Top LCD indicators -->
  <text x="156" y="218" fill="#141a14" font-family="monospace" font-weight="900" font-size="14">FR</text>
  <line x1="156" y1="222" x2="174" y2="222" stroke="#141a14" stroke-width="2.5" />
  <text x="354" y="218" fill="#141a14" font-family="monospace" font-weight="900" font-size="16" text-anchor="end">16</text>

  <!-- LCD Digits: 10:58 32 -->
  <text x="160" y="295" fill="#141a14" font-family="monospace" font-weight="900" font-size="52" letter-spacing="1">10:58</text>
  <text x="356" y="295" fill="#141a14" font-family="monospace" font-weight="900" font-size="34" letter-spacing="1" text-anchor="end">32</text>
  <text x="156" y="325" fill="#141a14" font-family="sans-serif" font-weight="bold" font-size="10">24H</text>
</svg>
